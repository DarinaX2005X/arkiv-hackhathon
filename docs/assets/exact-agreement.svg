<svg xmlns="http://www.w3.org/2000/svg" width="960" height="400" viewBox="0 0 960 400" role="img" aria-labelledby="title desc">
  <title id="title">A yes belongs to one exact version</title>
  <desc id="desc">This is the fictional local Small Works practice sequence. Oak transports artworks while Cedar and Willow install. After Oak withdraws, Cedar handles transport and Juniper joins Willow to install. The new version requires fresh local approval from every required contributor. These sample decisions are saved locally, not published on Arkiv.</desc>
  <defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fafbef"/><stop offset="1" stop-color="#e7eddf"/></linearGradient></defs>
  <rect width="960" height="400" rx="24" fill="url(#paper)"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="36" y="49" fill="#1e3b2d" font-size="27" font-weight="700">A yes belongs to one exact version</text>
    <rect x="36" y="82" width="368" height="214" rx="16" fill="#fff" stroke="#bdcbb6" stroke-width="1.5"/>
    <rect x="556" y="82" width="368" height="214" rx="16" fill="#173e2e"/>
    <text x="60" y="120" fill="#294935" font-size="23" font-weight="700">First agreement</text>
    <text x="60" y="152" fill="#586a56" font-size="17">Small Works exhibition</text>
    <path d="M60 170H380" stroke="#dde5d7"/>
    <text x="60" y="202" fill="#23402e" font-size="20">Transport</text><text x="380" y="202" text-anchor="end" fill="#23402e" font-size="20" font-weight="700">Oak</text>
    <text x="60" y="237" fill="#23402e" font-size="20">Installation</text><text x="380" y="237" text-anchor="end" fill="#23402e" font-size="20" font-weight="700">Cedar + Willow</text>
    <text x="60" y="274" fill="#5d7154" font-size="16">Decisions stay with this version</text>
    <path d="M418 190H542M532 182L542 190L532 198" fill="none" stroke="#557d42" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="480" y="154" text-anchor="middle" fill="#435c3b" font-size="16" font-weight="700">Oak</text>
    <text x="480" y="175" text-anchor="middle" fill="#435c3b" font-size="16">withdraws</text>
    <text x="580" y="120" fill="#f5f8e8" font-size="23" font-weight="700">Revised arrangement</text>
    <text x="580" y="152" fill="#c0d6bc" font-size="17">Same event, new decisions</text>
    <path d="M580 170H900" stroke="#3d6550"/>
    <text x="580" y="202" fill="#e5eddc" font-size="20">Transport</text><text x="900" y="202" text-anchor="end" fill="#e5eddc" font-size="20" font-weight="700">Cedar</text>
    <text x="580" y="237" fill="#e5eddc" font-size="20">Installation</text><text x="900" y="237" text-anchor="end" fill="#e5eddc" font-size="20" font-weight="700">Juniper + Willow</text>
    <text x="580" y="274" fill="#cee993" font-size="16">Every required owner approves again</text>
    <path d="M220 296V331H740V296" fill="none" stroke="#a8ba98" stroke-width="2"/>
    <rect x="250" y="321" width="460" height="47" rx="23" fill="#d4e6b5"/>
    <text x="480" y="351" text-anchor="middle" fill="#2c482a" font-size="19" font-weight="700">Each decision belongs to its exact version</text>
  </g>
</svg>
